[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "astpp"
version = "0.1.2"
description = "Self-Inlining Python Macro Preprocessor & Runtime Polyfill Library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "f-fix"}
]
keywords = ["ast", "preprocessor", "micropython", "pypy", "macros", "inlining", "const"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Pre-processors"
]

[project.urls]
Homepage = "https://github.com/f-fix/astpp"
Repository = "https://github.com/f-fix/astpp"
Issues = "https://github.com/f-fix/astpp/issues"

[project.scripts]
astpp = "astpp:main"
